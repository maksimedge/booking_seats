# HTTP → HTTPS redirect
server {
    listen 80;
    server_name booking.ddnsking.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name booking.ddnsking.com;

    ssl_certificate /etc/letsencrypt/live/booking.ddnsking.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booking.ddnsking.com/privkey.pem;

    # Дополнительные параметры SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}